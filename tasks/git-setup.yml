- name: Resolve gh executable
  ansible.builtin.shell: |
    if command -v gh >/dev/null 2>&1; then
      command -v gh
    elif [ -x "$HOME/.local/share/mise/shims/gh" ]; then
      printf '%s\n' "$HOME/.local/share/mise/shims/gh"
    else
      exit 1
    fi
  args:
    executable: /bin/bash
  register: gh_executable
  changed_when: false
  tags:
    - gh-extensions

- name: List installed gh extensions
  ansible.builtin.command:
    argv:
      - "{{ gh_executable.stdout }}"
      - extension
      - list
  register: gh_extensions
  changed_when: false
  tags:
    - gh-extensions

- name: Install gh extensions
  ansible.builtin.command:
    argv:
      - "{{ gh_executable.stdout }}"
      - extension
      - install
      - "{{ item }}"
  loop:
    - dlvhdr/gh-dash
    - github/gh-stack
  when: item not in gh_extensions.stdout
  tags:
    - gh-extensions
