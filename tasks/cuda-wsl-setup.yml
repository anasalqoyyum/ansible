- name: Ensure CUDA supports this WSL distribution
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['architecture'] == "x86_64"
      - ansible_facts['distribution_release'] in cuda_supported_ubuntu_releases.get(cuda_toolkit_version, [])
    fail_msg: >-
      CUDA Toolkit {{ cuda_toolkit_version }} does not support this WSL distribution.
      Supported Ubuntu releases: {{ cuda_supported_ubuntu_releases.get(cuda_toolkit_version, []) | join(', ') }}.
  tags:
    - cuda-wsl

- name: Download CUDA repository keyring
  ansible.builtin.get_url:
    url: "https://developer.download.nvidia.com/compute/cuda/repos/wsl-ubuntu/x86_64/cuda-keyring_{{ cuda_keyring_version }}_all.deb"
    dest: "/tmp/cuda-keyring_{{ cuda_keyring_version }}_all.deb"
    checksum: "{{ cuda_keyring_checksum }}"
    mode: "0644"
  tags:
    - cuda-wsl

- name: Install CUDA repository keyring
  become: true
  ansible.builtin.apt:
    deb: "/tmp/cuda-keyring_{{ cuda_keyring_version }}_all.deb"
    state: present
  tags:
    - cuda-wsl

- name: Install CUDA toolkit
  become: true
  ansible.builtin.apt:
    name: "cuda-toolkit-{{ cuda_toolkit_version }}"
    state: present
    update_cache: true
  tags:
    - cuda-wsl

- name: Remove CUDA repository keyring package
  ansible.builtin.file:
    path: "/tmp/cuda-keyring_{{ cuda_keyring_version }}_all.deb"
    state: absent
  tags:
    - cuda-wsl
