- name: Download Installer
  get_url:
    url: https://sh.rustup.rs
    dest: /tmp/sh.rustup.rs
    mode: "0755"
    force: true
  tags:
    - install
    - rust

- name: Install rust/cargo
  shell: /tmp/sh.rustup.rs -y
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/rustup"
  tags:
    - install
    - rust

- name: Update Rust toolchains and rustup
  ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/rustup update"
  tags:
    - install
    - rust
