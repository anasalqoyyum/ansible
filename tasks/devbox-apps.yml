- name: Install latest Chrome stable
  tags: [chrome, devbox-desktop]
  block:
    - name: Install or update Google Chrome stable
      become: true
      ansible.builtin.apt:
        deb: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        update_cache: true
        cache_valid_time: 3600

    - name: Create Chrome launcher directories
      tags: [keyring]
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /usr/local/bin
        - /usr/local/share/applications

    - name: Install Chrome command without a desktop keyring
      tags: [keyring]
      become: true
      ansible.builtin.copy:
        dest: /usr/local/bin/google-chrome
        mode: "0755"
        content: |
          #!/bin/sh
          exec /usr/bin/google-chrome-stable --password-store=basic "$@"

    - name: Install Chrome desktop launcher without a desktop keyring
      tags: [keyring]
      become: true
      ansible.builtin.copy:
        dest: /usr/local/share/applications/google-chrome.desktop
        mode: "0644"
        content: |
          [Desktop Entry]
          Type=Application
          Name=Google Chrome
          GenericName=Web Browser
          Exec=/usr/local/bin/google-chrome %U
          Icon=google-chrome
          Terminal=false
          StartupNotify=true
          Categories=Network;WebBrowser;
          MimeType=text/html;x-scheme-handler/http;x-scheme-handler/https;
          StartupWMClass=Google-chrome
          Actions=new-window;new-private-window;

          [Desktop Action new-window]
          Name=New Window
          Exec=/usr/local/bin/google-chrome

          [Desktop Action new-private-window]
          Name=New Incognito Window
          Exec=/usr/local/bin/google-chrome --incognito

- name: Install latest Helium AppImage
  tags: [helium]
  block:
    - name: Query latest Helium Linux release
      ansible.builtin.uri:
        url: https://api.github.com/repos/imputnet/helium-linux/releases/latest
        headers:
          Accept: application/vnd.github+json
        return_content: true
      register: devbox_helium_release
      check_mode: false
      changed_when: false

    - name: Select Helium AppImage for x86_64
      ansible.builtin.set_fact:
        devbox_helium_assets: >-
          {{ devbox_helium_release.json.assets
             | selectattr('name', 'match', '^helium-.*-x86_64\.AppImage$')
             | list }}

    - name: Require a matching Helium AppImage
      ansible.builtin.assert:
        that: devbox_helium_assets | length == 1
        fail_msg: "The latest Helium release has no unique x86_64 AppImage."

    - name: Require the Helium AppImage checksum
      ansible.builtin.assert:
        that: devbox_helium_assets[0].digest | default('') is match('^sha256:[0-9a-f]{64}$')
        fail_msg: "The Helium AppImage is missing its SHA-256 release digest."

    - name: Install Helium AppImage FUSE runtime
      become: true
      ansible.builtin.apt:
        name: libfuse2t64
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create Helium installation and launcher directories
      tags: [keyring]
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/helium
        - /usr/local/bin
        - /usr/local/share/applications
        - /usr/local/share/pixmaps
      register: devbox_helium_directories

    - name: Download or update Helium AppImage
      become: true
      ansible.builtin.get_url:
        url: "{{ devbox_helium_assets[0].browser_download_url }}"
        checksum: "{{ devbox_helium_assets[0].digest }}"
        dest: /opt/helium/helium.AppImage
        mode: "0755"
      register: devbox_helium_download
      # Check mode cannot use directories that it only predicts creating.
      when: not ansible_check_mode or not devbox_helium_directories.changed

    - name: Extract the bundled Helium icon
      become: true
      ansible.builtin.command:
        argv:
          - /opt/helium/helium.AppImage
          - --appimage-extract
          - helium.png
        chdir: /opt/helium
        creates: "{{ omit if devbox_helium_download.changed else '/opt/helium/squashfs-root/helium.png' }}"
      register: devbox_helium_icon
      when: not ansible_check_mode or not devbox_helium_directories.changed

    - name: Install the Helium launcher icon
      become: true
      ansible.builtin.copy:
        src: /opt/helium/squashfs-root/helium.png
        dest: /usr/local/share/pixmaps/helium.png
        remote_src: true
        mode: "0644"
      when:
        - not ansible_check_mode or not devbox_helium_directories.changed
        - not ansible_check_mode or not devbox_helium_icon.changed

    - name: Install Helium command without a desktop keyring
      tags: [keyring]
      become: true
      ansible.builtin.copy:
        dest: /usr/local/bin/helium
        follow: false
        mode: "0755"
        content: |
          #!/bin/sh
          exec /opt/helium/helium.AppImage --password-store=basic "$@"
      when: not ansible_check_mode or not devbox_helium_directories.changed

    - name: Install Helium desktop launcher
      become: true
      ansible.builtin.copy:
        dest: /usr/local/share/applications/helium.desktop
        mode: "0644"
        content: |
          [Desktop Entry]
          Type=Application
          Name=Helium
          GenericName=Web Browser
          Exec=/usr/local/bin/helium %U
          Icon=/usr/local/share/pixmaps/helium.png
          Terminal=false
          StartupNotify=true
          Categories=Network;WebBrowser;
          MimeType=text/html;x-scheme-handler/http;x-scheme-handler/https;
      when: not ansible_check_mode or not devbox_helium_directories.changed

- name: Install latest Ghostty release
  tags: [ghostty]
  block:
    - name: Install Wayland clipboard utilities
      tags: [clipboard]
      become: true
      ansible.builtin.apt:
        name: wl-clipboard
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Query latest Ghostty Ubuntu release
      ansible.builtin.uri:
        url: https://api.github.com/repos/mkasberg/ghostty-ubuntu/releases/latest
        headers:
          Accept: application/vnd.github+json
        return_content: true
      register: devbox_ghostty_release
      check_mode: false
      changed_when: false

    - name: Select Ghostty package for Ubuntu 26.04 on amd64
      ansible.builtin.set_fact:
        devbox_ghostty_assets: >-
          {{ devbox_ghostty_release.json.assets
             | selectattr('name', 'match', '^ghostty_.*_amd64_26\.04\.deb$')
             | list }}

    - name: Require a matching Ghostty Ubuntu package
      ansible.builtin.assert:
        that: devbox_ghostty_assets | length == 1
        fail_msg: "The latest Ghostty release has no unique Ubuntu 26.04 amd64 package."

    - name: Install or update Ghostty
      become: true
      ansible.builtin.apt:
        deb: "{{ devbox_ghostty_assets[0].browser_download_url }}"
        update_cache: true
        cache_valid_time: 3600

- name: Install Hyprland session
  tags: [hyprland]
  block:
    - name: Install Hyprland and its desktop utilities
      become: true
      ansible.builtin.apt:
        name:
          - hyprland
          - hyprland-qtutils
          - xdg-desktop-portal-hyprland
          - xwayland
          - hyprpolkitagent
          - waybar
          - fuzzel
          - fonts-noto-core
          - hyprlock
          - hypridle
          - hyprpaper
          - playerctl
          - grim
          - slurp
          - wl-clipboard
          - cliphist
          - hyprpicker
          - sway-notification-center
          - xdg-user-dirs
          - xdg-utils
        state: present
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600
      register: devbox_hyprland_packages

    # These packages enable their units for graphical-session.target, which the
    # GNOME session also reaches. hyprland.conf starts them instead.
    - name: Keep Hyprland session services out of GNOME sessions
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        scope: global
        enabled: false
      loop:
        - waybar.service
        - hyprpolkitagent.service
        - hypridle.service
        - hyprpaper.service
        - swaync.service
      when: not ansible_check_mode or not devbox_hyprland_packages.changed

    - name: Create the wallpaper directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.local/share/backgrounds"
        state: directory
        mode: "0755"

    - name: Install the Hyprland wallpaper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/bg/underwater.png"
        dest: "{{ ansible_facts['user_dir'] }}/.local/share/backgrounds/underwater.png"
        mode: "0644"

# Zed updates itself afterwards, so the installer only runs once.
- name: Install Zed
  tags: [zed]
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://zed.dev/install.sh | sh
    executable: /bin/bash
    creates: "{{ ansible_facts['user_dir'] }}/.local/bin/zed"

- name: Install latest T3 Code nightly
  tags: [t3code]
  block:
    - name: Query T3 Code releases including nightlies
      ansible.builtin.uri:
        url: https://api.github.com/repos/pingdotgg/t3code/releases?per_page=100
        headers:
          Accept: application/vnd.github+json
        return_content: true
      register: devbox_t3code_releases
      check_mode: false
      changed_when: false

    - name: Select published T3 Code nightlies by publication time
      ansible.builtin.set_fact:
        devbox_t3code_nightlies: >-
          {{ devbox_t3code_releases.json
             | rejectattr('draft')
             | selectattr('tag_name', 'search', '-nightly\.')
             | sort(attribute='published_at', reverse=true)
             | list }}

    - name: Require a published T3 Code nightly
      ansible.builtin.assert:
        that: devbox_t3code_nightlies | length > 0
        fail_msg: "No published T3 Code nightly was found in the latest 100 releases."

    - name: Select the newest T3 Code nightly amd64 package
      ansible.builtin.set_fact:
        devbox_t3code_assets: >-
          {{ devbox_t3code_nightlies[0].assets
             | selectattr('name', 'match', '^T3-Code-.*-amd64\.deb$')
             | list }}

    - name: Require an amd64 package from the newest T3 Code nightly
      ansible.builtin.assert:
        that: devbox_t3code_assets | length == 1
        fail_msg: "The newest T3 Code nightly has no unique amd64 Debian package."

    - name: Install or update T3 Code nightly
      become: true
      ansible.builtin.apt:
        deb: "{{ devbox_t3code_assets[0].browser_download_url }}"
        update_cache: true
        cache_valid_time: 3600
