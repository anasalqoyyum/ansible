- name: Install latest Chrome stable
  tags: [chrome, devbox-desktop]
  block:
    - name: Install or update Google Chrome stable
      become: true
      ansible.builtin.apt:
        deb: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        update_cache: true
        cache_valid_time: 3600

    - name: Create Chrome launcher directories
      tags: [keyring]
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /usr/local/bin
        - /usr/local/share/applications

    - name: Install Chrome command without a desktop keyring
      tags: [keyring]
      become: true
      ansible.builtin.copy:
        dest: /usr/local/bin/google-chrome
        mode: "0755"
        content: |
          #!/bin/sh
          exec /usr/bin/google-chrome-stable --password-store=basic "$@"

    - name: Install Chrome desktop launcher without a desktop keyring
      tags: [keyring]
      become: true
      ansible.builtin.copy:
        dest: /usr/local/share/applications/google-chrome.desktop
        mode: "0644"
        content: |
          [Desktop Entry]
          Type=Application
          Name=Google Chrome
          GenericName=Web Browser
          Exec=/usr/local/bin/google-chrome %U
          Icon=google-chrome
          Terminal=false
          StartupNotify=true
          Categories=Network;WebBrowser;
          MimeType=text/html;x-scheme-handler/http;x-scheme-handler/https;
          StartupWMClass=Google-chrome
          Actions=new-window;new-private-window;

          [Desktop Action new-window]
          Name=New Window
          Exec=/usr/local/bin/google-chrome

          [Desktop Action new-private-window]
          Name=New Incognito Window
          Exec=/usr/local/bin/google-chrome --incognito

- name: Install latest Helium AppImage
  tags: [helium]
  block:
    - name: Query latest Helium Linux release
      ansible.builtin.uri:
        url: https://api.github.com/repos/imputnet/helium-linux/releases/latest
        headers:
          Accept: application/vnd.github+json
        return_content: true
      register: devbox_helium_release
      check_mode: false
      changed_when: false

    - name: Select Helium AppImage for x86_64
      ansible.builtin.set_fact:
        devbox_helium_assets: >-
          {{ devbox_helium_release.json.assets
             | selectattr('name', 'match', '^helium-.*-x86_64\.AppImage$')
             | list }}

    - name: Require a matching Helium AppImage
      ansible.builtin.assert:
        that: devbox_helium_assets | length == 1
        fail_msg: "The latest Helium release has no unique x86_64 AppImage."

    - name: Require the Helium AppImage checksum
      ansible.builtin.assert:
        that: devbox_helium_assets[0].digest | default('') is match('^sha256:[0-9a-f]{64}$')
        fail_msg: "The Helium AppImage is missing its SHA-256 release digest."

    - name: Install Helium AppImage FUSE runtime
      become: true
      ansible.builtin.apt:
        name: libfuse2t64
        state: latest
        update_cache: true
        cache_valid_time: 0

    - name: Create Helium installation and launcher directories
      tags: [keyring]
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/helium
        - /usr/local/bin
        - /usr/local/share/applications
        - /usr/local/share/pixmaps
      register: devbox_helium_directories

    - name: Download or update Helium AppImage
      become: true
      ansible.builtin.get_url:
        url: "{{ devbox_helium_assets[0].browser_download_url }}"
        checksum: "{{ devbox_helium_assets[0].digest }}"
        dest: /opt/helium/helium.AppImage
        mode: "0755"
      register: devbox_helium_download
      # Check mode cannot use directories that it only predicts creating.
      when: not ansible_check_mode or not devbox_helium_directories.changed

    - name: Extract the bundled Helium icon
      become: true
      ansible.builtin.command:
        argv:
          - /opt/helium/helium.AppImage
          - --appimage-extract
          - helium.png
        chdir: /opt/helium
        creates: "{{ omit if devbox_helium_download.changed else '/opt/helium/squashfs-root/helium.png' }}"
      register: devbox_helium_icon
      when: not ansible_check_mode or not devbox_helium_directories.changed

    - name: Install the Helium launcher icon
      become: true
      ansible.builtin.copy:
        src: /opt/helium/squashfs-root/helium.png
        dest: /usr/local/share/pixmaps/helium.png
        remote_src: true
        mode: "0644"
      when:
        - not ansible_check_mode or not devbox_helium_directories.changed
        - not ansible_check_mode or not devbox_helium_icon.changed

    - name: Install Helium command without a desktop keyring
      tags: [keyring]
      become: true
      ansible.builtin.copy:
        dest: /usr/local/bin/helium
        follow: false
        mode: "0755"
        content: |
          #!/bin/sh
          exec /opt/helium/helium.AppImage --password-store=basic "$@"
      when: not ansible_check_mode or not devbox_helium_directories.changed

    - name: Install Helium desktop launcher
      become: true
      ansible.builtin.copy:
        dest: /usr/local/share/applications/helium.desktop
        mode: "0644"
        content: |
          [Desktop Entry]
          Type=Application
          Name=Helium
          GenericName=Web Browser
          Exec=/usr/local/bin/helium %U
          Icon=/usr/local/share/pixmaps/helium.png
          Terminal=false
          StartupNotify=true
          Categories=Network;WebBrowser;
          MimeType=text/html;x-scheme-handler/http;x-scheme-handler/https;
      when: not ansible_check_mode or not devbox_helium_directories.changed

- name: Install latest Ghostty release
  tags: [ghostty]
  block:
    - name: Install Wayland clipboard utilities
      tags: [clipboard]
      become: true
      ansible.builtin.apt:
        name: wl-clipboard
        state: latest
        update_cache: true
        cache_valid_time: 0

    - name: Query latest Ghostty Ubuntu release
      ansible.builtin.uri:
        url: https://api.github.com/repos/mkasberg/ghostty-ubuntu/releases/latest
        headers:
          Accept: application/vnd.github+json
        return_content: true
      register: devbox_ghostty_release
      check_mode: false
      changed_when: false

    - name: Select Ghostty package for Ubuntu 26.04 on amd64
      ansible.builtin.set_fact:
        devbox_ghostty_assets: >-
          {{ devbox_ghostty_release.json.assets
             | selectattr('name', 'match', '^ghostty_.*_amd64_26\.04\.deb$')
             | list }}

    - name: Require a matching Ghostty Ubuntu package
      ansible.builtin.assert:
        that: devbox_ghostty_assets | length == 1
        fail_msg: "The latest Ghostty release has no unique Ubuntu 26.04 amd64 package."

    - name: Install or update Ghostty
      become: true
      ansible.builtin.apt:
        deb: "{{ devbox_ghostty_assets[0].browser_download_url }}"
        update_cache: true
        cache_valid_time: 3600

- name: Install Hyprland session
  tags: [hyprland]
  block:
    - name: Install Hyprland and its desktop utilities
      become: true
      ansible.builtin.apt:
        name:
          - hyprland
          - hyprland-qtutils
          - xdg-desktop-portal-hyprland
          - xwayland
          - hyprpolkitagent
          - waybar
          - fuzzel
          - fonts-noto-core
          - hyprlock
          - hypridle
          - hyprpaper
          - playerctl
          - grim
          - slurp
          - wl-clipboard
          - cliphist
          - hyprpicker
          - xdg-user-dirs
          - xdg-utils
        state: latest
        install_recommends: false
        update_cache: true
        cache_valid_time: 0
      register: devbox_hyprland_packages

    # Hokum draws the notification cards. Its manifest names the current stable
    # build and that build's sha256. The .deb installs hokum.service without
    # enabling it, so Hyprland starts it and nothing else does.
    - name: Query the latest Hokum release manifest
      ansible.builtin.uri:
        url: https://anoma.ly/release/hokum/desktop/stable.json
        return_content: true
      register: devbox_hokum_manifest
      check_mode: false
      changed_when: false

    - name: Read the installed Hokum package
      ansible.builtin.command: dpkg-query -W -f=${Status} ${Version} hokum
      register: devbox_hokum_installed
      changed_when: false
      failed_when: false
      check_mode: false

    # nfpm appends release 1 to the manifest version, so the .deb reports
    # 0.1.3-1. A changed release suffix reinstalls once and then settles. The
    # status prefix keeps a removed package from counting as installed.
    - name: Install or update Hokum
      when: >-
        devbox_hokum_installed.rc != 0 or
        devbox_hokum_installed.stdout !=
        'install ok installed ' ~ devbox_hokum_manifest.json.release.version ~ '-1'
      block:
        - name: Create the Hokum download directory
          ansible.builtin.file:
            path: "{{ ansible_facts['user_dir'] }}/.cache/hokum"
            state: directory
            mode: "0755"

        - name: Download the Hokum Debian package
          ansible.builtin.get_url:
            url: >-
              https://anoma.ly{{ devbox_hokum_manifest.json.release.targets['linux-x64-deb'].url }}
            dest: >-
              {{ ansible_facts['user_dir'] }}/.cache/hokum/hokum_{{ devbox_hokum_manifest.json.release.version }}_amd64.deb
            checksum: >-
              sha256:{{ devbox_hokum_manifest.json.release.targets['linux-x64-deb'].sha256 }}
            mode: "0644"
          check_mode: false

        - name: Install Hokum
          become: true
          ansible.builtin.apt:
            deb: >-
              {{ ansible_facts['user_dir'] }}/.cache/hokum/hokum_{{ devbox_hokum_manifest.json.release.version }}_amd64.deb
            update_cache: true
            cache_valid_time: 3600

    # swaync's activation file claims org.freedesktop.Notifications too, so it
    # has to go rather than sit unused: whichever daemon a notification starts
    # first would own the name. The diversion is from an earlier provisioning
    # run that kept the package installed instead. hyprland.conf started swaync
    # directly, so removing the package leaves that process running.
    - name: Stop a running SwayNotificationCenter
      ansible.builtin.command: pkill -x swaync
      register: devbox_swaync_stop
      changed_when: devbox_swaync_stop.rc == 0
      failed_when: false

    - name: Restore SwayNotificationCenter's activation file
      become: true
      community.general.dpkg_divert:
        path: /usr/share/dbus-1/services/org.erikreider.swaync.service
        divert: /usr/share/dbus-1/services/org.erikreider.swaync.service.disabled
        rename: true
        state: absent

    - name: Remove SwayNotificationCenter
      become: true
      ansible.builtin.apt:
        name: sway-notification-center
        state: absent

    # These packages enable their units for graphical-session.target, which the
    # GNOME session also reaches. hyprland.conf starts them instead.
    - name: Keep Hyprland session services out of GNOME sessions
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        scope: global
        enabled: false
      loop:
        - waybar.service
        - hyprpolkitagent.service
        - hypridle.service
        - hyprpaper.service
      when: not ansible_check_mode or not devbox_hyprland_packages.changed

    # The Hokum unit arrives with the .deb, so a check run on a machine without
    # the package has nothing to disable.
    - name: Keep Hokum out of GNOME sessions
      become: true
      ansible.builtin.systemd_service:
        name: hokum.service
        scope: global
        enabled: false
      when: not ansible_check_mode or devbox_hokum_installed.rc == 0


    - name: Create the wallpaper directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.local/share/backgrounds"
        state: directory
        mode: "0755"

    - name: Install the Hyprland wallpaper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/bg/underwater.png"
        dest: "{{ ansible_facts['user_dir'] }}/.local/share/backgrounds/underwater.png"
        mode: "0644"

- name: Install Zed
  tags: [zed]
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://zed.dev/install.sh | sh
    executable: /bin/bash

- name: Install latest Obsidian stable
  tags: [obsidian]
  block:
    - name: Query latest Obsidian release
      ansible.builtin.uri:
        url: https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest
        headers:
          Accept: application/vnd.github+json
        return_content: true
      register: devbox_obsidian_release
      check_mode: false
      changed_when: false

    - name: Select Obsidian Debian package for amd64
      ansible.builtin.set_fact:
        devbox_obsidian_assets: >-
          {{ devbox_obsidian_release.json.assets
             | selectattr('name', 'match', '^obsidian_[^/]+_amd64\.deb$')
             | list }}

    - name: Require a matching Obsidian package
      ansible.builtin.assert:
        that: devbox_obsidian_assets | length == 1
        fail_msg: "The latest Obsidian release has no unique amd64 Debian package."

    - name: Require the Obsidian package checksum
      ansible.builtin.assert:
        that: devbox_obsidian_assets[0].digest | default('') is match('^sha256:[0-9a-f]{64}$')
        fail_msg: "The Obsidian package is missing its SHA-256 release digest."

    - name: Create the Obsidian package cache
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.cache/ansible/obsidian"
        state: directory
        mode: "0755"
      register: devbox_obsidian_cache

    - name: Download or update the verified Obsidian package
      ansible.builtin.get_url:
        url: "{{ devbox_obsidian_assets[0].browser_download_url }}"
        checksum: "{{ devbox_obsidian_assets[0].digest }}"
        dest: "{{ ansible_facts['user_dir'] }}/.cache/ansible/obsidian/obsidian-amd64.deb"
        mode: "0644"
      when: not ansible_check_mode or not devbox_obsidian_cache.changed

    - name: Install or update Obsidian
      become: true
      ansible.builtin.apt:
        deb: "{{ ansible_facts['user_dir'] }}/.cache/ansible/obsidian/obsidian-amd64.deb"
        update_cache: true
        cache_valid_time: 3600
      when: not ansible_check_mode or not devbox_obsidian_cache.changed

- name: Install OBS Studio from its official Ubuntu repository
  tags: [obs-studio]
  become: true
  block:
    - name: Install the Debian repository management library
      ansible.builtin.apt:
        name: python3-debian
        state: latest
        update_cache: true

    - name: Configure the OBS Studio Ubuntu PPA
      ansible.builtin.deb822_repository:
        name: obsproject-obs-studio
        types: [deb]
        uris: https://ppa.launchpadcontent.net/obsproject/obs-studio/ubuntu
        suites: resolute
        components: [main]
        signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xBC7345F522079769F5BBE987EFC71127F425E228
        state: present

    - name: Install or update OBS Studio
      ansible.builtin.apt:
        name: obs-studio
        state: latest
        install_recommends: false
        update_cache: true
        cache_valid_time: 0

- name: Install Spotify from its official Debian repository
  tags: [spotify]
  become: true
  block:
    - name: Install the Debian repository management library for Spotify
      ansible.builtin.apt:
        name: python3-debian
        state: latest
        update_cache: true
        cache_valid_time: 0

    - name: Configure the Spotify Debian repository
      ansible.builtin.deb822_repository:
        name: spotify
        types: [deb]
        uris: https://repository.spotify.com
        suites: stable
        components: [non-free]
        architectures: [amd64]
        signed_by: https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.asc
        state: present

    - name: Install or update Spotify
      ansible.builtin.apt:
        name: spotify-client
        state: latest
        install_recommends: false
        update_cache: true

- name: Install latest T3 Code nightly
  tags: [t3code]
  block:
    - name: Require a safe absolute home path for T3 Code integration
      ansible.builtin.assert:
        that: ansible_facts['user_dir'] is match('^/[A-Za-z0-9_./-]+\Z')
        fail_msg: "T3 Code integration requires an absolute home path containing only letters, digits, slashes, dots, underscores, and hyphens."

    - name: Query T3 Code releases including nightlies
      ansible.builtin.uri:
        url: https://api.github.com/repos/pingdotgg/t3code/releases?per_page=100
        headers:
          Accept: application/vnd.github+json
        return_content: true
      register: devbox_t3code_releases
      check_mode: false
      changed_when: false

    - name: Select published T3 Code nightlies by publication time
      ansible.builtin.set_fact:
        devbox_t3code_nightlies: >-
          {{ devbox_t3code_releases.json
             | rejectattr('draft')
             | selectattr('tag_name', 'search', '-nightly\.')
             | sort(attribute='published_at', reverse=true)
             | list }}

    - name: Require a published T3 Code nightly
      ansible.builtin.assert:
        that: devbox_t3code_nightlies | length > 0
        fail_msg: "No published T3 Code nightly was found in the latest 100 releases."

    - name: Select the newest T3 Code nightly x86_64 AppImage
      ansible.builtin.set_fact:
        devbox_t3code_assets: >-
          {{ devbox_t3code_nightlies[0].assets
             | selectattr('name', 'match', '^T3-Code-.*-x86_64\.AppImage$')
             | list }}

    - name: Require an x86_64 AppImage from the newest T3 Code nightly
      ansible.builtin.assert:
        that: devbox_t3code_assets | length == 1
        fail_msg: "The newest T3 Code nightly has no unique x86_64 AppImage."

    - name: Require the T3 Code AppImage checksum
      ansible.builtin.assert:
        that: devbox_t3code_assets[0].digest | default('') is match('^sha256:[0-9a-f]{64}$')
        fail_msg: "The T3 Code AppImage is missing its SHA-256 release digest."

    - name: Install T3 Code AppImage runtime and integration tools
      become: true
      ansible.builtin.apt:
        name:
          - libfuse2t64
          - apparmor
          - xdg-utils
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create user-owned T3 Code installation and launcher directories
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - .local/share/t3code
        - .local/bin
        - .local/share/applications
        - .local/share/icons
        - .cache/ansible/t3code
      register: devbox_t3code_directories

    - name: Download or update T3 Code AppImage
      ansible.builtin.get_url:
        url: "{{ devbox_t3code_assets[0].browser_download_url }}"
        checksum: "{{ devbox_t3code_assets[0].digest }}"
        dest: "{{ ansible_facts['user_dir'] }}/.local/share/t3code/t3code.AppImage"
        mode: "0755"
      register: devbox_t3code_download
      when: not ansible_check_mode or not devbox_t3code_directories.changed

    - name: Allow T3 Code AppImage to use the Electron user namespace sandbox
      become: true
      ansible.builtin.copy:
        dest: /etc/apparmor.d/devbox-t3code-appimage
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/apparmor_parser --skip-cache --skip-kernel-load %s
        content: |
          abi <abi/4.0>,
          include <tunables/global>

          profile devbox-t3code-appimage "{{ ansible_facts['user_dir'] }}/.local/share/t3code/t3code.AppImage" flags=(unconfined) {
            userns,
          }
      register: devbox_t3code_apparmor

    - name: Load the T3 Code AppImage sandbox policy
      become: true
      ansible.builtin.command:
        argv:
          - /usr/sbin/apparmor_parser
          - --replace
          - --skip-cache
          - /etc/apparmor.d/devbox-t3code-appimage
      changed_when: devbox_t3code_apparmor.changed

    - name: Extract the bundled T3 Code icon
      ansible.builtin.command:
        argv:
          - "{{ ansible_facts['user_dir'] }}/.local/share/t3code/t3code.AppImage"
          - --appimage-extract
          - usr/share/icons/hicolor/512x512/apps/t3code.png
        chdir: "{{ ansible_facts['user_dir'] }}/.cache/ansible/t3code"
        creates: "{{ omit if devbox_t3code_download.changed else ansible_facts['user_dir'] + '/.cache/ansible/t3code/squashfs-root/usr/share/icons/hicolor/512x512/apps/t3code.png' }}"
      register: devbox_t3code_icon
      when: not ansible_check_mode or not devbox_t3code_directories.changed

    - name: Install the T3 Code launcher icon
      ansible.builtin.copy:
        src: "{{ ansible_facts['user_dir'] }}/.cache/ansible/t3code/squashfs-root/usr/share/icons/hicolor/512x512/apps/t3code.png"
        dest: "{{ ansible_facts['user_dir'] }}/.local/share/icons/t3code.png"
        remote_src: true
        mode: "0644"
      when:
        - not ansible_check_mode or not devbox_t3code_directories.changed
        - not ansible_check_mode or not devbox_t3code_icon.changed

    - name: Install the T3 Code AppImage command
      ansible.builtin.copy:
        dest: "{{ ansible_facts['user_dir'] }}/.local/bin/t3code"
        mode: "0755"
        content: |
          #!/bin/sh
          exec "{{ ansible_facts['user_dir'] }}/.local/share/t3code/t3code.AppImage" "$@"
      when: not ansible_check_mode or not devbox_t3code_directories.changed

    - name: Install the T3 Code AppImage desktop launcher
      ansible.builtin.copy:
        dest: "{{ ansible_facts['user_dir'] }}/.local/share/applications/t3code.desktop"
        mode: "0644"
        content: |
          [Desktop Entry]
          Type=Application
          Name=T3 Code (Nightly)
          Exec=/usr/bin/env "{{ ansible_facts['user_dir'] }}/.local/bin/t3code" %U
          Icon={{ ansible_facts['user_dir'] }}/.local/share/icons/t3code.png
          Terminal=false
          StartupWMClass=t3code
          Categories=Development;
          MimeType=x-scheme-handler/t3code;x-scheme-handler/t3code-dev;
      when: not ansible_check_mode or not devbox_t3code_directories.changed

    - name: Check the T3 Code URL scheme handlers
      ansible.builtin.command:
        argv:
          - xdg-mime
          - query
          - default
          - "{{ item }}"
      loop:
        - x-scheme-handler/t3code
        - x-scheme-handler/t3code-dev
      register: devbox_t3code_handlers
      check_mode: false
      changed_when: false

    - name: Register the T3 Code AppImage URL scheme handlers
      ansible.builtin.command:
        argv:
          - xdg-mime
          - default
          - t3code.desktop
          - "{{ item.item }}"
      loop: "{{ devbox_t3code_handlers.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stdout != 't3code.desktop'
      changed_when: true

    - name: Remove the old T3 Code Debian package
      tags: [t3code-remove-deb]
      become: true
      ansible.builtin.apt:
        name: t3code
        state: absent
