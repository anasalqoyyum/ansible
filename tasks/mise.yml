- name: Download mise installer
  ansible.builtin.get_url:
    url: https://mise.run
    dest: /tmp/install-mise.sh
    mode: "0755"
    force: true
  tags:
    - install
    - mise
    - linux-only

- name: Install mise
  ansible.builtin.command: /bin/sh /tmp/install-mise.sh
  args:
    chdir: "{{ ansible_facts['env']['HOME'] }}"
  tags:
    - install
    - mise
    - linux-only
