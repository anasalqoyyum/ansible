- name: Install Core Packages
  become: true
  apt:
    name:
      - build-essential
      - bubblewrap
      - btop
      - chafa
      - clang
      - cmake
      - curl
      - fuse
      - ffmpeg
      - git
      - jq
      - libbz2-dev
      - libclang-dev
      - libpthread-stubs0-dev
      - libtool
      - libtool-bin
      - libffi-dev
      - liblzma-dev
      - libncursesw5-dev
      - libreadline-dev
      - libsqlite3-dev
      - libssl-dev
      - libxml2-dev
      - libxmlsec1-dev
      - llvm
      - make
      - ncdu
      - pkg-config
      - thunar
      - timg
      - tk-dev
      - unzip
      - wget
      - xdg-utils
      - xz-utils
      - zlib1g-dev
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install
    - core

# wslu was dropped from the Ubuntu archive after questing and upstream is
# archived at 4.1.3, so the PPA build is the only remaining source. It is pure
# shell; its deps (desktop-file-utils, bc, psmisc) still exist on 26.04.
- name: Install wslu for wslview
  become: true
  apt:
    deb: https://launchpad.net/~wslutilities/+archive/ubuntu/wslu/+files/wslu_4.1.3-1ubuntu1~22.04_amd64.deb
  when: "'microsoft' in (ansible_facts['kernel'] | lower)"
  tags:
    - install
    - core
    - wsl
