- name: Install nightly
  shell: "{{ rustup }} toolchain install nightly"
  vars:
    rustup: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/rustup"
  args:
    executable: /bin/bash
    chdir: "{{ ansible_facts['env']['HOME'] }}"
  tags:
    - install
    - rust

- name: Install rust-analyzer
  shell: "{{ rustup }} component list --installed | grep -q '^rust-analyzer' || {{ rustup }} component add rust-analyzer"
  vars:
    rustup: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/rustup"
  args:
    executable: /bin/bash
    chdir: "{{ ansible_facts['env']['HOME'] }}"
  tags:
    - install
    - rust
