- name: Download cargo-binstall installer
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh
    dest: /tmp/install-cargo-binstall.sh
    mode: "0755"
    force: true
  tags:
    - install
    - rust
    - rust-tools

- name: Install cargo-binstall
  ansible.builtin.command: /bin/bash /tmp/install-cargo-binstall.sh
  args:
    chdir: "{{ ansible_facts['env']['HOME'] }}"
  tags:
    - install
    - rust
    - rust-tools

- name: Install eza
  shell: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/cargo-binstall --no-confirm eza || {{ ansible_facts['env']['HOME'] }}/.cargo/bin/cargo install eza"
  args:
    executable: /bin/bash
    chdir: "{{ ansible_facts['env']['HOME'] }}"
  tags:
    - install
    - rust
    - rust-tools

- name: Install typst-cli
  shell: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/cargo-binstall --no-confirm typst-cli || {{ ansible_facts['env']['HOME'] }}/.cargo/bin/cargo install --locked typst-cli"
  args:
    executable: /bin/bash
    chdir: "{{ ansible_facts['env']['HOME'] }}"
  tags:
