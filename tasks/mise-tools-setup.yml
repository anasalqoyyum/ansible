- name: Resolve mise executable
  ansible.builtin.shell: |
    if command -v mise >/dev/null 2>&1; then
      command -v mise
    elif [ -x "$HOME/.local/bin/mise" ]; then
      printf '%s\n' "$HOME/.local/bin/mise"
    elif [ -x "/opt/homebrew/bin/mise" ]; then
      printf '%s\n' "/opt/homebrew/bin/mise"
    elif [ -x "/usr/local/bin/mise" ]; then
      printf '%s\n' "/usr/local/bin/mise"
    else
      exit 1
    fi
  args:
    executable: /bin/bash
  register: mise_executable
  changed_when: false
  check_mode: false
  tags:
    - install
    - mise

- name: Check for missing mise tools
  ansible.builtin.command:
    argv:
      - "{{ mise_executable.stdout }}"
      - install
      - --dry-run-code
  register: mise_install_check
  changed_when: false
  check_mode: false
  failed_when: mise_install_check.rc not in [0, 1]
  tags:
    - install
    - mise

- name: Install configured mise tools
  ansible.builtin.command:
    argv:
      - "{{ mise_executable.stdout }}"
      - install
      - --yes
  when: mise_install_check.rc == 1
  tags:
    - install
    - mise

- name: Check for outdated mise tools
  ansible.builtin.command:
    argv:
      - "{{ mise_executable.stdout }}"
      - upgrade
      - --dry-run-code
  register: mise_upgrade_check
  changed_when: false
  check_mode: false
  failed_when: mise_upgrade_check.rc not in [0, 1]
  tags:
    - install
    - mise

- name: Upgrade configured mise tools within their version ranges
  ansible.builtin.command:
    argv:
      - "{{ mise_executable.stdout }}"
      - upgrade
      - --yes
      - --no-prune
  when: mise_upgrade_check.rc == 1
  tags:
    - install
    - mise
