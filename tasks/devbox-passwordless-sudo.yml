- name: Require a non-root development account with a sudoers-safe name
  ansible.builtin.assert:
    that:
      - ansible_facts['user_uid'] | int > 0
      - ansible_facts['user_id'] is match('^[a-zA-Z_][a-zA-Z0-9_.-]*[$]?$')
    fail_msg: "Passwordless sudo requires a regular development user with a standard Linux account name."

- name: Explain passwordless sudo access
  ansible.builtin.debug:
    msg: >-
      Enabling passwordless sudo for {{ ansible_facts['user_id'] }}.
      Every app, script, and coding agent running as this user can become root
      without authentication. Tailscale does not protect against local account compromise.
  when: devbox_passwordless_sudo_enabled | default(true) | bool

- name: Enable passwordless sudo for the development user
  become: true
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-devbox-nopasswd
    owner: root
    group: root
    mode: "0440"
    content: |
      {{ ansible_facts['user_id'] }} ALL=(ALL:ALL) NOPASSWD: ALL
    validate: /usr/sbin/visudo -cf %s
  when: devbox_passwordless_sudo_enabled | default(true) | bool

- name: Remove the managed passwordless sudo policy
  become: true
  ansible.builtin.file:
    path: /etc/sudoers.d/99-devbox-nopasswd
    state: absent
  when: not (devbox_passwordless_sudo_enabled | default(true) | bool)
