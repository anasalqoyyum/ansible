- name: Set up BrowserSkill
  tags:
    - install
    - ai-tools
    - browser-skill
  block:
    - name: Download BrowserSkill installer
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/Tencent/BrowserSkill/main/install.sh
        dest: /tmp/install-browser-skill.sh
        mode: "0755"
        force: true

    - name: Install BrowserSkill CLI
      ansible.builtin.command: /bin/sh /tmp/install-browser-skill.sh
      args:
        chdir: "{{ ansible_facts['env']['HOME'] }}"
      environment:
        BSK_INSTALL_DIR: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

    - name: Verify BrowserSkill CLI
      ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.local/bin/bsk --version"
      changed_when: false
      when: not ansible_check_mode
