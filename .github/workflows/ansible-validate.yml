name: ansible-validate

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install ansible uv

      - name: Install dotfiles test dependencies
        run: sudo apt-get update && sudo apt-get install -y stow zsh rsync openssh-server

      - name: Test dotfiles and devbox
        run: make test-dotfiles test-devbox

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax check playbooks
        run: make syntax-check

      - name: Lint playbooks and tasks
        run: make lint
