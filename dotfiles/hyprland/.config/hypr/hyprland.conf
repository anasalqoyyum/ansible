# Keybindings mirror dotfiles/komorebi/.config/komorebi/whkdrc and
# dotfiles/yabai/.config/skhd/skhdrc. See misc/window-management.md.

$terminal = ghostty
$menu = fuzzel

monitor = , preferred, auto, auto

# Started here instead of through graphical-session.target, which GNOME also uses.
exec-once = waybar
exec-once = ~/.local/libexec/hyprpolkitagent
exec-once = hypridle
exec-once = hyprpaper
exec-once = swaync
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Colours follow the savy-dark Ghostty theme.
general {
    # gaps_in applies to each side, so neighbouring windows sit 6px apart.
    gaps_in = 3
    gaps_out = 5
    border_size = 2
    col.active_border = rgb(b4cbff) rgb(7aa6da) 45deg
    col.inactive_border = rgb(343a47)
    layout = dwindle
}

decoration {
    rounding = 8
    shadow {
        range = 12
        color = rgba(000000aa)
    }
    blur {
        size = 4
        passes = 2
    }
}

# Hyprland's built-in default runs every animation at speed 8 (0.8s).
animations {
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 0, 0, 1, 1
    animation = global, 1, 5, default
    animation = border, 1, 4, easeOutQuint
    animation = windows, 1, 3.5, easeOutQuint
    animation = windowsIn, 1, 3, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.5, linear, popin 87%
    animation = fade, 1, 2.5, easeOutQuint
    animation = layers, 1, 3, easeOutQuint
    animation = workspaces, 0
}

group {
    col.border_active = rgb(b4cbff)
    col.border_inactive = rgb(343a47)
    groupbar {
        font_family = Noto Sans
        font_size = 11
        text_color = rgb(f5f5f5)
        col.active = rgb(343a47)
        col.inactive = rgb(1d1f21)
    }
}

dwindle {
    preserve_split = true
    # New windows take the right or bottom half, like yabai's second_child.
    force_split = 2
}

misc {
    # Lets `hyprctl --instance 0 dispatch exec hyprlock` over SSH recover a crashed lock screen.
    allow_session_lock_restore = true
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(0a0a0a)
    # Wake the monitor after the power menu's "Display off".
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

input {
    kb_layout = us
    # Click to focus, as with komorebi and yabai.
    follow_mouse = 2
}

$mod = ALT

bind = $mod, Q, killactive,
bind = $mod, M, movetoworkspacesilent, special:minimized
bind = $mod SHIFT, M, togglespecialworkspace, minimized

bind = $mod, Return, exec, $terminal
bind = $mod, Space, exec, $menu
bind = CTRL ALT, Delete, exit,
bind = SUPER, L, exec, loginctl lock-session
bind = SUPER SHIFT, S, exec, ~/.config/hypr/screenshot-area
bind = SUPER, V, exec, ~/.config/hypr/clipboard-history
bind = SUPER SHIFT, C, exec, hyprpicker --autocopy --format hex

# Focus windows
bind = $mod SHIFT, H, movefocus, l
bind = $mod SHIFT, J, movefocus, d
bind = $mod SHIFT, K, movefocus, u
bind = $mod SHIFT, L, movefocus, r
bind = $mod SHIFT, bracketleft, cyclenext, prev
bind = $mod SHIFT, bracketright, cyclenext

# Move windows
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, Return, layoutmsg, movetoroot

# Stack windows. Hyprland groups replace stacks: Alt+Shift+G starts a group on
# the focused window, then the bindings below pull neighbours into it.
bind = $mod SHIFT, G, togglegroup,
bind = CTRL $mod SHIFT, left, moveintogroup, l
bind = CTRL $mod SHIFT, down, moveintogroup, d
bind = CTRL $mod SHIFT, up, moveintogroup, u
bind = CTRL $mod SHIFT, right, moveintogroup, r
bind = $mod, semicolon, moveoutofgroup,
bind = $mod, bracketleft, changegroupactive, b
bind = $mod, bracketright, changegroupactive, f

# Resize
binde = $mod, equal, resizeactive, 50 0
binde = $mod, minus, resizeactive, -50 0
binde = $mod SHIFT, equal, resizeactive, 0 50
binde = $mod SHIFT, minus, resizeactive, 0 -50

# Manipulate windows
bind = $mod SHIFT, T, togglefloating,
bind = $mod SHIFT, F, fullscreen, 1

# Layouts. Dwindle flips one split at a time, not the whole workspace.
bind = $mod SHIFT, X, layoutmsg, swapsplit
bind = $mod SHIFT, Y, layoutmsg, togglesplit

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8

# Send focused window to workspace, without following it
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

bind = CTRL SHIFT, 2, global, com.t3tools.T3Code:capture-window
