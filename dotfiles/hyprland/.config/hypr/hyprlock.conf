# Colours follow the savy-dark Ghostty theme.
$font = Noto Sans

background {
    monitor =
    path = ~/.local/share/backgrounds/underwater.png
    blur_passes = 3
    brightness = 0.5
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0a0a0acc)
    outer_color = rgb(b4cbff) rgb(7aa6da) 45deg
    check_color = rgb(f0c674)
    fail_color = rgb(cc6666)
    font_color = rgb(f5f5f5)
    fade_on_empty = false
    rounding = 8
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgb(f5f5f5)
    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    color = rgb(f5f5f5)
    position = -30, -150
    halign = right
    valign = top
}
