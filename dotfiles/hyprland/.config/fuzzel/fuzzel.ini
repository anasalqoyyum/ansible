# Colours follow the savy-dark Ghostty theme.
[main]
font=Noto Sans:size=12
terminal=ghostty -e
prompt="> "
width=40
lines=12
horizontal-pad=16
vertical-pad=12
inner-pad=8

[colors]
background=0a0a0af2
text=c5c8c6ff
prompt=b4cbffff
input=f5f5f5ff
match=b4cbffff
selection=343a47ff
selection-text=f5f5f5ff
selection-match=b4cbffff
border=b4cbffff

[border]
width=2
radius=8
