personality = "pragmatic"
model = "gpt-6-sol"
model_reasoning_effort = "medium"
model_verbosity = "low"
model_reasoning_summary = "detailed"
# model_provider = "cliproxyapi"

suppress_unstable_features_warning = true
approvals_reviewer = "auto_review"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[agents]
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[features]
default_mode_request_user_input = true
hooks = true
unified_exec = true
wsl_remote_connections = true
context_management.experimental_mode = true
prevent_idle_sleep = true
analytics_plan_history = true
api_key_model_discovery = true # Required for model discovery in the CLIProxyAPI provider

[notice]
hide_full_access_warning = true

[tui]
status_line = [
  "model-with-reasoning",
  "context-remaining",
  "current-dir",
  "git-branch",
  "fast-mode",
]
pet = "disabled"
screen_reader_detection_done = true

[model_providers]

[model_providers.cliproxyapi]
name = "EasyCLIProxyAPI"
base_url = "http://127.0.0.1:8317/v1"
model_catalog_url = "http://127.0.0.1:8317/v1/models"
wire_api = "responses"
supports_websockets = true
env_key = "CPA_PROXY_API_KEY"
# experimental_bearer_token = "CPA_PROXY_API_KEY"
