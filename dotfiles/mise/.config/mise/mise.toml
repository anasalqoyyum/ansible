[tools]
node = { version = "26", postinstall = "npm install -g corepack && corepack enable && exit 0" }
bun = "latest"
go = "prefix:1.27"
python = "3.15"
dotnet = "10"
java = { version = "27", os = ["linux", "macos"] }
maven = { version = "3.10", os = ["linux", "macos"] }
gradle = { version = "9.8", os = ["linux", "macos"] }
kotlin = { version = "2.4", os = ["linux", "macos"] }
# CLI Tools
kubectl = { version = "latest", os = ["linux"] }
k6 = { version = "latest", os = ["linux"] }
k9s = { version = "latest", os = ["linux"] }
bob = "latest"
'aqua:ankitpokhrel/jira-cli' = "latest"
github-cli = { version = "latest", os = ["linux", "windows"] }
docker-cli = { version = "latest", os = ["linux"] }
docker-compose = { version = "latest", os = ["linux"] }
httpie-go = "latest"
lazydocker = "latest"
trivy = "latest"
aws-cli = "latest"
television = "latest"
ast-grep = "latest"
rclone = "latest"
yt-dlp = "latest"
# Go Tools
air = "latest"
"github:avivsinai/bitbucket-cli" = "latest"
golangci-lint = "latest"
# Python Tools
uv = "latest"
"pipx:sqlit-tui" = "latest"
"pipx:pgcli" = { version = "latest", os = ["linux", "macos"] }
"pipx:mycli" = { version = "latest", os = ["linux", "macos"] }
# Node Tools
biome = { version = "latest" }
prettier = { version = "latest" }
"npm:typescript" = { version = "latest" }
# "npm:@typescript/native-preview" = { version = "latest" }
"npm:oxlint" = { version = "latest" }
"npm:oxlint-tsgolint" = { version = "latest" }
"npm:oxfmt" = { version = "latest" }
# Npm Tools
"npm:@frostoven/squoosh-cli" = { version = "latest" }
"npm:@hubspot/cli" = { version = "latest" }
"npm:@bitwarden/cli" = { version = "latest" }
"npm:confluence-cli" = { version = "latest" }
"npm:netlify-cli" = { version = "latest" }
"npm:hunkdiff" = "latest"
# To setup typescript-plugin
"npm:@astrojs/ts-plugin" = { version = "latest" }
"npm:@vue/typescript-plugin" = { version = "latest" }
"npm:typescript-svelte-plugin" = { version = "latest" }

[settings]
python.uv_venv_auto = true
python.uv_venv_create_args = ["--seed"]
pipx.uvx = true
# Always use bun since I jump around a lot between node versions.
npm.bun = true
# This setting is used to allow change version based on the idiomatic version file (e.g .nvmrc).
idiomatic_version_file_enable_tools = ["node"]
experimental = true
lockfile = false
auto_update = true

[settings.github]
credential_command = 'gh auth token --hostname {% if os() == "windows" %}%MISE_CREDENTIAL_HOST%{% else %}"$MISE_CREDENTIAL_HOST"{% endif %}'

[env]
# MISE_QUIET = true
OPENCODE_EXPERIMENTAL_OXFMT = true
OPENCODE_EXPERIMENTAL_PLAN_MODE = true
OPENCODE_EXPERIMENTAL_MARKDOWN = true
CLAUDE_CODE_SKIP_WINDOWS_PROFILE = 1
CLAUDE_CODE_HIDE_ACCOUNT_INFO = 1
