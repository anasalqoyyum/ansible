surface0 = "#1D1F21"
surface1 = "#343A47"
overlay0 = "#666666"
overlay1 = "#C5C8C6"
text = "#F5F5F5"
subtext0 = "#C5C8C6"
mauve = "#B294BB"
green = "#B5BD68"
