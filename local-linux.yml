- name: Configure local Linux workstation
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    source_key: "{{ lookup('env', 'ANSIBLE_SOURCE_SSH_KEY') | default('./.ssh/id_ed25519', true) }}"
    dest_key: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
    install_cuda_wsl: false
    install_openssh_server_wsl: false
    cuda_toolkit_version: "13-3"
    cuda_supported_ubuntu_releases:
      "12-9": [focal, jammy, noble]
      "13-3": [jammy, noble, resolute]
    cuda_keyring_version: "1.1-1"
    cuda_keyring_checksum: "sha256:eea6cc5f0eaeb99082d054b8c05ae206a378e31e88048df0310d59f651dceed2"
  pre_tasks:
    - name: Ensure host is Linux
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == "Linux"
        fail_msg: "local-linux.yml should only run on Linux/WSL hosts."
      tags:
        - install
        - core

    - name: Update Apt
      become: true
      apt:
        force_apt_get: true
        update_cache: true
        state: present
      tags:
        - install
        - core
    - name: WSL config
      copy:
        src: "conf/wsl.conf"
        dest: "/etc/wsl.conf"
        mode: "0644"
        force: false
      become: true
      when: "'microsoft' in (ansible_facts['kernel'] | lower)"
      tags:
        - install
        - core
        - wsl
  tasks:
    - name: Configure SSH
      ansible.builtin.import_tasks: tasks/ssh.yml

    - name: Install core packages
      ansible.builtin.import_tasks: tasks/core-setup.yml

    - name: Install Linux tools
      ansible.builtin.import_tasks: tasks/linux-tools-setup.yml

    - name: Install Rust
      ansible.builtin.import_tasks: tasks/rust-setup.yml

    - name: Install Rust tools
      ansible.builtin.import_tasks: tasks/rust-tools-setup.yml

    - name: Install mise
      ansible.builtin.import_tasks: tasks/mise.yml

    - name: Install AI tools
      ansible.builtin.import_tasks: tasks/ai-tools.yml

    - name: Install Herdr
      ansible.builtin.import_tasks: tasks/herdr-setup.yml

    - name: Configure Zsh
      ansible.builtin.import_tasks: tasks/zsh-setup.yml

    - name: Configure Docker
      ansible.builtin.import_tasks: tasks/docker-setup.yml

    - name: Configure dotfiles
      ansible.builtin.import_tasks: tasks/dotfiles.yml

    - name: Install Herdr plugins
      ansible.builtin.import_tasks: tasks/herdr-plugins.yml

    - name: Install mise tools
      ansible.builtin.import_tasks: tasks/mise-tools-setup.yml

    - name: Configure Git
      ansible.builtin.import_tasks: tasks/git-setup.yml

    - name: Install win32yank
      ansible.builtin.import_tasks: tasks/win32yank-setup.yml

    - name: Install AGS CLI
      ansible.builtin.import_tasks: tasks/ags-cli-setup.yml

    - name: Install OpenSSH server on WSL
      ansible.builtin.import_tasks: tasks/openssh-wsl-setup.yml
      when:
        - "'microsoft' in (ansible_facts['kernel'] | lower)"
        - install_openssh_server_wsl | bool
      tags:
        - install
        - openssh-server
        - wsl

    - name: Install CUDA on WSL
      ansible.builtin.import_tasks: tasks/cuda-wsl-setup.yml
      when:
        - "'microsoft' in (ansible_facts['kernel'] | lower)"
        - install_cuda_wsl | bool
