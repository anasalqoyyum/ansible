- name: Configure local macOS workstation
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    source_key: "{{ lookup('env', 'ANSIBLE_SOURCE_SSH_KEY') | default('./.ssh/id_ed25519', true) }}"
    dest_key: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
  pre_tasks:
    - name: Ensure host is macOS
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == "Darwin"
        fail_msg: "local-macos.yml should only run on macOS hosts."

    - name: Check if brew is installed
      command: which brew
      register: brew_check
      changed_when: false
      ignore_errors: true

    - name: Install brew
      shell: 'NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
      when: brew_check.rc != 0

    - name: Check if git is installed
      command: which git
      changed_when: false

    - name: Touch .hushlogin
      file:
        path: "{{ lookup('env', 'HOME') }}/.hushlogin"
        state: touch
  tasks:
    - name: Configure SSH
      ansible.builtin.import_tasks: tasks/ssh.yml

    - name: Install core Homebrew packages
      ansible.builtin.import_tasks: tasks/core-brew-setup.yml

    - name: Install AI tools
      ansible.builtin.import_tasks: tasks/ai-tools.yml

    - name: Install Rust
      ansible.builtin.import_tasks: tasks/rust-setup.yml

    - name: Install Rust tools
      ansible.builtin.import_tasks: tasks/rust-tools-setup.yml

    - name: Configure dotfiles
      ansible.builtin.import_tasks: tasks/dotfiles.yml

    - name: Install mise tools
      ansible.builtin.import_tasks: tasks/mise-tools-setup.yml

    - name: Configure Git
      ansible.builtin.import_tasks: tasks/git-setup.yml

    - name: Install AGS CLI
      ansible.builtin.import_tasks: tasks/ags-cli-setup.yml
